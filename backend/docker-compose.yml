# Prefer the project-root docker-compose.yml.
# This file remains for `cd backend && docker compose up -d`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kungfu_postgres
    environment:
      POSTGRES_DB: kungfu_word_quest
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d kungfu_word_quest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: kungfu_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
