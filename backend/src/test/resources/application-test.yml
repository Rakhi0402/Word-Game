spring:
  datasource:
    url: jdbc:h2:mem:wordquest_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy0zMi1ieXRlcw==
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000

logging:
  level:
    root: WARN
    com.kungfu.wordquest: INFO
