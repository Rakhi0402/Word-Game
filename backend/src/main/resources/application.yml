spring:
  application:
    name: ${APP_NAME:kungfu-word-quest-backend}
  profiles:
    default: local

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/kungfu_word_quest}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${MAX_POOL_SIZE:10}
      minimum-idle: ${MIN_IDLE_SIZE:2}
      connection-timeout: ${CONNECTION_TIMEOUT:30000}
      idle-timeout: ${IDLE_TIMEOUT:600000}
      pool-name: wordquest-hikari

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    # Existing DBs (Hibernate-created) are baselined at v1; only V2+ run.
    # Empty DBs run V1 then V2.
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    hibernate:
      # Schema is owned by Flyway. Never use update/create in production.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: false
        jdbc:
          batch_size: ${BATCH_SIZE:20}
        order_inserts: true
        order_updates: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}

# JWT — never commit real secrets; set JWT_SECRET via environment / .env
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:${EXPIRATION_MS:86400000}}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:${REFRESH_EXPIRATION_MS:604800000}}

# Optional first-admin bootstrap (see AdminBootstrapRunner)
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
  username: ${ADMIN_USERNAME:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  shutdown: graceful

# Puzzle generation & game calendar
puzzles:
  game-timezone: ${PUZZLE_GAME_TIMEZONE:Asia/Kolkata}
  dictionary:
    path: ${PUZZLE_DICTIONARY_PATH:classpath:dictionaries/wordlist.txt}
  weekly:
    easy: ${PUZZLE_WEEKLY_EASY:14}
    medium: ${PUZZLE_WEEKLY_MEDIUM:14}
    hard: ${PUZZLE_WEEKLY_HARD:7}
    expert: ${PUZZLE_WEEKLY_EXPERT:7}
    max-attempts-per-candidate: ${PUZZLE_MAX_ATTEMPTS:200}
    min-valid-words: ${PUZZLE_MIN_VALID_WORDS:20}
  generation:
    easy-min-words: ${PUZZLE_EASY_MIN_WORDS:20}
    medium-min-words: ${PUZZLE_MEDIUM_MIN_WORDS:35}
    hard-min-words: ${PUZZLE_HARD_MIN_WORDS:50}
    expert-min-words: ${PUZZLE_EXPERT_MIN_WORDS:70}
    easy-min-pangrams: 1
    medium-min-pangrams: 1
    hard-min-pangrams: 1
    expert-min-pangrams: 2
    easy-soft-max-words: 45
    medium-soft-max-words: 70
    hard-soft-max-words: 100
    expert-soft-max-words: 0
    min-dictionary-words: ${PUZZLE_MIN_DICT_WORDS:1000}
  schedule:
    daily-cron: ${PUZZLE_DAILY_CRON:0 1 0 * * *}
    weekly-cron: ${PUZZLE_WEEKLY_CRON:0 0 3 * * SUN}

# Groq LLM (admin AI puzzle letter-set proposals only — words always validated locally)
groq:
  enabled: ${GROQ_ENABLED:true}
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}
  timeout-ms: ${GROQ_TIMEOUT_MS:60000}
  max-tokens: ${GROQ_MAX_TOKENS:2048}
  temperature: ${GROQ_TEMPERATURE:0.7}

# Offline Word Quest dictionary (ESDB/SCOWL import → PostgreSQL)
wordquest:
  dictionary:
    enabled: ${WQ_DICT_ENABLED:true}
    source: ${WQ_DICT_SOURCE:ESDB}
    source-version: ${WQ_DICT_SOURCE_VERSION:1.0.0}
    path: ${WQ_DICT_PATH:classpath:dictionaries/wordlist.txt}
    frequency-enabled: ${WQ_DICT_FREQ_ENABLED:true}
    frequency-source: ${WQ_DICT_FREQ_SOURCE:wordfreq}
    frequency-path: ${WQ_DICT_FREQ_PATH:}
    min-word-length: ${WQ_DICT_MIN_LEN:4}
    max-word-length: ${WQ_DICT_MAX_LEN:32}
    seed-if-empty: ${WQ_DICT_SEED_IF_EMPTY:true}
    filter:
      reject-hyphenated: true
      reject-apostrophe: true
      reject-proper-nouns: true
      reject-numeric: true
      reject-non-ascii-letters: true
    difficulty:
      easy-frequency-threshold: 0.55
      medium-frequency-threshold: 0.30

# Comma-separated origins; used by SecurityConfig CORS bean
app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  seed:
    # Dev-only local admin fallback (admin@local.test). Must be false in production.
    local-admin: ${APP_SEED_LOCAL_ADMIN:true}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info}
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.kungfu.wordquest: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
